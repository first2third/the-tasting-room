name: Rename uploaded file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "first2third"
          git config user.email "first2third@users.noreply.github.com"
          git mv -f the-tasting-room-index.html index.html
          git commit -m "Rename uploaded file to index.html"
          git push
