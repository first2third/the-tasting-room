name: Rename to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "first2third"
          git config user.email "first2third@users.noreply.github.com"
          git mv the-tasting-room-public-edition.html index.html
          git commit -m "Rename file to index.html"
          git push
